# Netlify deployment for the Membrane AI dashboard (web/dashboard).
# Mode A (demo) by default: a static-friendly Next.js app with deterministic
# synthetic fixtures — no privileged credentials required. Mode B (connected)
# additionally sets the server-side AGENTTWIN_* env (never NEXT_PUBLIC_*) and
# requires a reachable backend; it is NOT production-ready until auth/CORS/TLS/
# E2E are separately verified (DASHBOARD_AND_NETLIFY_WORKFLOW.md §6).

[build]
  base = "web/dashboard"
  command = "npm run build"
  # The Next.js runtime adapter sets the publish output; do not hard-code a dir.

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "22"
  # Demo mode needs no backend env. For Mode B, set these in the Netlify UI
  # (Site settings → Environment variables) as NON-public, server-side only.
  # Full end-to-end runbook: docs/agenttwin-integration/DEPLOYMENT.md.
  #
  # Membrane evidence read API (real persisted release decisions):
  #   MEMBRANE_EVIDENCE_URL          (https, e.g. https://<app>.fly.dev)
  #   MEMBRANE_EVIDENCE_API_KEY      (secret — never a NEXT_PUBLIC_* var)
  #   MEMBRANE_EVIDENCE_ALLOWED_HOSTS (bare hostname(s), e.g. <app>.fly.dev)
  #
  # AgentTwin control-plane (live Agent Assurance eval/trace/sim):
  #   AGENTTWIN_BASE_URL      (https, allowlisted)
  #   AGENTTWIN_API_KEY       (secret — never a NEXT_PUBLIC_* var)
  #   AGENTTWIN_ALLOWED_HOSTS (bare hostname(s))
  #   AGENTTWIN_ORG           (optional org id → X-AgentTwin-Org)
  #   AGENTTWIN_UI_URL        (for trace deep links)
  #
  # Allowlist rule (src/lib/server/allowlist.ts): a non-loopback destination MUST
  # be https and its bare hostname MUST be listed in the matching *_ALLOWED_HOSTS.
  # *_ALLOW_LOOPBACK=1 is for local dev only — never set it in production.
  # Never place a secret in a NEXT_PUBLIC_* variable or in this file.

# HTML is always revalidated; hashed static assets are immutable.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
