version: "3"

# Every Go command sets GOWORK=off inline so the stray machine-level GOWORK
# never hijacks resolution (in-repo `replace` directives wire the modules
# together; see docs/HANDOVER.md). CGO is off for portable local builds.

vars:
  GO_MODULES: clients/cli pkg proto services/analyzer services/ingestion services/orchestrator services/reporter services/resolver
  # Path to the semantic service's venv interpreter (created by task setup:py).
  SEMANTIC_PY: '{{if eq OS "windows"}}.venv/Scripts/python.exe{{else}}.venv/bin/python{{end}}'

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list
    silent: true

  proto:
    desc: Lint and (re)generate protobuf stubs
    dir: proto
    cmds:
      - buf lint
      - buf generate

  lint:
    desc: buf lint + golangci-lint across all Go modules
    cmds:
      - cd proto && buf lint
      - for: { var: GO_MODULES }
        cmd: cd {{.ITEM}} && GOWORK=off golangci-lint run ./...

  test:
    desc: Run tests with coverage across all Go modules
    cmds:
      - for: { var: GO_MODULES }
        cmd: cd {{.ITEM}} && GOWORK=off CGO_ENABLED=0 go test -cover ./...

  build:
    desc: Build all Go modules
    cmds:
      - for: { var: GO_MODULES }
        cmd: cd {{.ITEM}} && GOWORK=off CGO_ENABLED=0 go build ./...

  tidy:
    desc: go mod tidy across all Go modules
    cmds:
      - for: { var: GO_MODULES }
        cmd: cd {{.ITEM}} && GOWORK=off go mod tidy

  setup:py:
    desc: Create the semantic service venv and install dev dependencies
    dir: services/semantic
    cmds:
      - python -m venv .venv
      - '{{.SEMANTIC_PY}} -m pip install --quiet --upgrade pip'
      - '{{.SEMANTIC_PY}} -m pip install --quiet -e ".[dev]"'

  lint:py:
    desc: ruff + mypy --strict on the semantic service (needs task setup:py once)
    dir: services/semantic
    preconditions:
      - sh: test -f {{.SEMANTIC_PY}}
        msg: "semantic venv missing — run: task setup:py"
    cmds:
      - '{{.SEMANTIC_PY}} -m ruff check .'
      - '{{.SEMANTIC_PY}} -m ruff format --check .'
      - '{{.SEMANTIC_PY}} -m mypy semantic'

  test:py:
    desc: pytest on the semantic service
    dir: services/semantic
    preconditions:
      - sh: test -f {{.SEMANTIC_PY}}
        msg: "semantic venv missing — run: task setup:py"
    cmds:
      - '{{.SEMANTIC_PY}} -m pytest'

  run:semantic:
    desc: Run the semantic service (HTTP :8005, health on the same port)
    dir: services/semantic
    env:
      MEMBRANE_SEMANTIC_PORT: "8005"
    cmds:
      - '{{.SEMANTIC_PY}} -m semantic.main'

  build:cli:
    desc: Build the static Code Sweeper binary into bin/ (CGO off, current platform)
    dir: clients/cli
    env:
      GOWORK: "off"
      CGO_ENABLED: "0"
    cmds:
      - go build -trimpath -ldflags "-s -w" -o ../../bin/membrane{{exeExt}} ./cmd/membrane

  ci:
    desc: Full local CI gate (run before "pushla")
    cmds:
      - task: lint
      - task: test
      - task: build
      - task: lint:py
      - task: test:py

  migrate:
    desc: Apply SQL migrations (up) to the dev Postgres via docker compose
    cmds:
      - for: sources
        cmd: docker compose -f deploy/compose/docker-compose.dev.yml exec -T postgres psql -U membrane -d membrane -v ON_ERROR_STOP=1 -f /dev/stdin < {{.ITEM}}
    sources:
      - deploy/migrations/*.up.sql

  dev-up:
    desc: Start the local dev stack (Redpanda, Redis, pgvector)
    cmds:
      - docker compose -f deploy/compose/docker-compose.dev.yml up -d

  dev-down:
    desc: Stop and remove the local dev stack
    cmds:
      - docker compose -f deploy/compose/docker-compose.dev.yml down -v

  run:ingestion:
    desc: Run the ingestion service locally in in-memory mode (no Kafka needed)
    dir: services/ingestion
    env:
      GOWORK: "off"
      MEMBRANE_INGESTION_USE_IN_MEMORY: "true"
      MEMBRANE_INGESTION_LOG_LEVEL: "debug"
    cmds:
      - go run ./cmd/ingestion

  run:orchestrator:
    desc: Run the orchestrator against the dev stack (Kafka + Redis via task dev-up)
    dir: services/orchestrator
    env:
      GOWORK: "off"
      MEMBRANE_ORCHESTRATOR_LOG_LEVEL: "debug"
    cmds:
      - go run ./cmd/orchestrator

  run:analyzer:
    desc: Run the static analyzer service (gRPC :9003, health :8103)
    dir: services/analyzer
    env:
      GOWORK: "off"
      MEMBRANE_ANALYZER_LOG_LEVEL: "debug"
    cmds:
      - go run ./cmd/analyzer

  run:resolver:
    desc: Run the context resolver service (gRPC :9004, health :8104; needs dev postgres)
    dir: services/resolver
    env:
      GOWORK: "off"
      MEMBRANE_RESOLVER_LOG_LEVEL: "debug"
    cmds:
      - go run ./cmd/resolver

  run:reporter:
    desc: Run the reporter service (health :8105; consumes code.verdict.v1)
    dir: services/reporter
    env:
      GOWORK: "off"
      MEMBRANE_REPORTER_LOG_LEVEL: "debug"
    cmds:
      - go run ./cmd/reporter
