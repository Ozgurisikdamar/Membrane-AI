version: "3"

# Every Go command sets GOWORK=off inline so the stray machine-level GOWORK
# never hijacks resolution (in-repo `replace` directives wire the modules
# together; see docs/HANDOVER.md). CGO is off for portable local builds.

vars:
  GO_MODULES: clients/cli eval pkg proto services/analyzer services/gateway services/ingestion services/orchestrator services/reporter services/resolver
  # Path to the semantic service's venv interpreter (created by task setup:py).
  SEMANTIC_PY: '{{if eq OS "windows"}}.venv/Scripts/python.exe{{else}}.venv/bin/python{{end}}'

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list
    silent: true

  proto:
    desc: Lint and (re)generate protobuf stubs
    dir: proto
    cmds:
      - buf lint
      - buf generate

  lint:
    desc: buf lint + golangci-lint across all Go modules
    cmds:
      - cd proto && buf lint
      - for: { var: GO_MODULES }
        cmd: cd {{.ITEM}} && GOWORK=off golangci-lint run ./...

  test:
    desc: Run tests with coverage across all Go modules
    cmds:
      - for: { var: GO_MODULES }
        cmd: cd {{.ITEM}} && GOWORK=off CGO_ENABLED=0 go test -cover ./...

  build:
    desc: Build all Go modules
    cmds:
      - for: { var: GO_MODULES }
        cmd: cd {{.ITEM}} && GOWORK=off CGO_ENABLED=0 go build ./...

  tidy:
    desc: go mod tidy across all Go modules
    cmds:
      - for: { var: GO_MODULES }
        cmd: cd {{.ITEM}} && GOWORK=off go mod tidy

  setup:py:
    desc: Create the semantic service venv and install dev dependencies
    dir: services/semantic
    cmds:
      - python -m venv .venv
      - '{{.SEMANTIC_PY}} -m pip install --quiet --upgrade pip'
      - '{{.SEMANTIC_PY}} -m pip install --quiet -e ".[dev]"'

  lint:py:
    desc: ruff + mypy --strict on the semantic service (needs task setup:py once)
    dir: services/semantic
    preconditions:
      - sh: test -f {{.SEMANTIC_PY}}
        msg: "semantic venv missing — run: task setup:py"
    cmds:
      - '{{.SEMANTIC_PY}} -m ruff check .'
      - '{{.SEMANTIC_PY}} -m ruff format --check .'
      - '{{.SEMANTIC_PY}} -m mypy semantic'

  test:py:
    desc: pytest on the semantic service
    dir: services/semantic
    preconditions:
      - sh: test -f {{.SEMANTIC_PY}}
        msg: "semantic venv missing — run: task setup:py"
    cmds:
      - '{{.SEMANTIC_PY}} -m pytest'

  run:semantic:
    desc: Run the semantic service (HTTP :8005, health on the same port)
    dir: services/semantic
    env:
      MEMBRANE_SEMANTIC_PORT: "8005"
    cmds:
      - '{{.SEMANTIC_PY}} -m semantic.main'

  build:cli:
    desc: Build the static Code Sweeper binary into bin/ (CGO off, current platform)
    dir: clients/cli
    cmds:
      # GOWORK inline — the machine-level GOWORK override outranks task env blocks.
      - GOWORK=off CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o ../../bin/membrane{{exeExt}} ./cmd/membrane

  build:images:
    desc: Build all service container images (distroless Go + python-slim semantic)
    vars:
      GO_SERVICES: analyzer gateway ingestion orchestrator reporter resolver
    cmds:
      - for: { var: GO_SERVICES }
        cmd: docker build -f deploy/docker/Dockerfile.go --build-arg SERVICE=services/{{.ITEM}} -t membrane/{{.ITEM}}:dev .
      - docker build -f deploy/docker/Dockerfile.semantic -t membrane/semantic:dev .

  publish:images:
    desc: Build and PUSH multi-arch (amd64+arm64) images to a registry (set REGISTRY + TAG)
    vars:
      GO_SERVICES: analyzer gateway ingestion orchestrator reporter resolver
      REGISTRY: '{{.REGISTRY | default "ghcr.io/ozgurisikdamar"}}'
      TAG: '{{.TAG | default "dev"}}'
      PLATFORMS: linux/amd64,linux/arm64
    cmds:
      - docker buildx create --use --name membrane-builder 2>/dev/null || true
      - for: { var: GO_SERVICES }
        cmd: >-
          docker buildx build --platform {{.PLATFORMS}}
          -f deploy/docker/Dockerfile.go --build-arg SERVICE=services/{{.ITEM}}
          -t {{.REGISTRY}}/membrane-{{.ITEM}}:{{.TAG}} --push .
      - >-
        docker buildx build --platform {{.PLATFORMS}}
        -f deploy/docker/Dockerfile.semantic
        -t {{.REGISTRY}}/membrane-semantic:{{.TAG}} --push .

  full-up:
    desc: Start the all-container profile (task build:images first)
    cmds:
      - docker compose -f deploy/compose/docker-compose.full.yml up -d

  full-down:
    desc: Stop and remove the all-container profile
    cmds:
      - docker compose -f deploy/compose/docker-compose.full.yml down -v

  eval:
    desc: Score the deterministic detectors against the labeled corpus (accuracy SLO gate)
    dir: eval
    cmds:
      - GOWORK=off CGO_ENABLED=0 go run ./cmd/eval

  release:check:
    desc: Validate the CLI GoReleaser config (needs goreleaser)
    dir: clients/cli
    env:
      GOWORK: "off"
    cmds:
      - goreleaser check

  release:snapshot:
    desc: Build the CLI release artifacts locally (no publish) into clients/cli/dist
    dir: clients/cli
    env:
      GOWORK: "off"
    cmds:
      - goreleaser release --snapshot --clean

  release:
    desc: Tag-driven CLI release (run on a vX.Y.Z tag; needs GITHUB_TOKEN)
    dir: clients/cli
    env:
      GOWORK: "off"
    cmds:
      - goreleaser release --clean

  helm:lint:
    desc: Lint and render the Helm chart (requires helm; schema check if kubeconform present)
    cmds:
      - helm lint deploy/helm/membrane
      - helm template smoke deploy/helm/membrane --set credentials.databaseUrl=x --set provisioning.topics.enabled=true > /dev/null
      - cmd: helm template smoke deploy/helm/membrane --set credentials.databaseUrl=x --set provisioning.topics.enabled=true | kubeconform -strict -summary
        ignore_error: true # kubeconform is optional tooling

  ci:
    desc: Full local CI gate (run before "pushla")
    cmds:
      - task: lint
      - task: test
      - task: build
      - task: lint:py
      - task: test:py

  migrate:
    desc: Apply SQL migrations (up) to the dev Postgres via docker compose
    cmds:
      - for: sources
        cmd: docker compose -f deploy/compose/docker-compose.dev.yml exec -T postgres psql -U membrane -d membrane -v ON_ERROR_STOP=1 -f /dev/stdin < {{.ITEM}}
    sources:
      - deploy/migrations/*.up.sql

  dev-up:
    desc: Start the local dev stack (Redpanda, Redis, pgvector)
    cmds:
      - docker compose -f deploy/compose/docker-compose.dev.yml up -d

  dev-down:
    desc: Stop and remove the local dev stack
    cmds:
      - docker compose -f deploy/compose/docker-compose.dev.yml down -v

  run:ingestion:
    desc: Run the ingestion service locally in in-memory mode (no Kafka needed)
    dir: services/ingestion
    env:
      GOWORK: "off"
      MEMBRANE_INGESTION_USE_IN_MEMORY: "true"
      MEMBRANE_INGESTION_LOG_LEVEL: "debug"
    cmds:
      - go run ./cmd/ingestion

  run:orchestrator:
    desc: Run the orchestrator against the dev stack (Kafka + Redis via task dev-up)
    dir: services/orchestrator
    env:
      GOWORK: "off"
      MEMBRANE_ORCHESTRATOR_LOG_LEVEL: "debug"
    cmds:
      - go run ./cmd/orchestrator

  run:analyzer:
    desc: Run the static analyzer service (gRPC :9003, health :8103)
    dir: services/analyzer
    env:
      GOWORK: "off"
      MEMBRANE_ANALYZER_LOG_LEVEL: "debug"
    cmds:
      - go run ./cmd/analyzer

  run:gateway:
    desc: Run the MCP gateway service (HTTP :8006, health :8106)
    dir: services/gateway
    env:
      GOWORK: "off"
      MEMBRANE_GATEWAY_LOG_LEVEL: "debug"
    cmds:
      - go run ./cmd/gateway

  run:resolver:
    desc: Run the context resolver service (gRPC :9004, health :8104; needs dev postgres)
    dir: services/resolver
    env:
      GOWORK: "off"
      MEMBRANE_RESOLVER_LOG_LEVEL: "debug"
    cmds:
      - go run ./cmd/resolver

  run:reporter:
    desc: Run the reporter service (health :8105; consumes code.verdict.v1)
    dir: services/reporter
    env:
      GOWORK: "off"
      MEMBRANE_REPORTER_LOG_LEVEL: "debug"
    cmds:
      - go run ./cmd/reporter
