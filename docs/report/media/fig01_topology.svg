<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#F8FBFF"/>
    <stop offset="1" stop-color="#EEF7F6"/>
  </linearGradient>
  <linearGradient id="mint" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#DDF8F4"/>
    <stop offset="1" stop-color="#EAF6FF"/>
  </linearGradient>
  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#EAF2FF"/>
    <stop offset="1" stop-color="#F8FBFF"/>
  </linearGradient>
  <style>
    .title{font:700 44px Inter,Segoe UI,Arial,sans-serif;fill:#0F2747}
    .subtitle{font:400 20px Inter,Segoe UI,Arial,sans-serif;fill:#64748B}
    .section{font:700 24px Inter,Segoe UI,Arial,sans-serif;fill:#0F2747}
    .sectionMint{font:700 24px Inter,Segoe UI,Arial,sans-serif;fill:#0F766E}
    .cardTitle{font:700 24px Inter,Segoe UI,Arial,sans-serif;fill:#0F2747}
    .cardText{font:400 18px Inter,Segoe UI,Arial,sans-serif;fill:#334155}
    .small{font:400 17px Inter,Segoe UI,Arial,sans-serif;fill:#475569}
  </style>
</defs>

<rect width="1600" height="1120" fill="url(#bg)"/>

<text x="800" y="58" text-anchor="middle" class="title">MEMBRANE.AI System Topology</text>
<text x="800" y="96" text-anchor="middle" class="subtitle">Event-driven microservices · proactive gateway + post-generation hooks · target &lt;150 ms at edge</text>

<!-- EDGE -->
<rect x="60" y="125" width="1480" height="175" rx="28" fill="url(#mint)" stroke="#2A9D8F" stroke-width="3"/>
<text x="90" y="162" class="sectionMint">EDGE &amp; INGESTION</text>

<rect x="92" y="182" width="690" height="88" rx="20" fill="#FFFFFF" stroke="#3B82F6" stroke-width="2.5"/>
<text x="437" y="215" text-anchor="middle" class="cardTitle">IDE / Prompt Gateway</text>
<text x="437" y="243" text-anchor="middle" class="cardText">VS Code · Cursor · Claude Code</text>
<text x="437" y="266" text-anchor="middle" class="small">gRPC over HTTP/2 streaming</text>

<rect x="818" y="182" width="690" height="88" rx="20" fill="#FFFFFF" stroke="#3B82F6" stroke-width="2.5"/>
<text x="1163" y="215" text-anchor="middle" class="cardTitle">Source Control Webhooks</text>
<text x="1163" y="243" text-anchor="middle" class="cardText">GitHub · GitLab · Bitbucket</text>
<text x="1163" y="266" text-anchor="middle" class="small">TLS 1.3</text>

<path d="M800 300v26" stroke="#2A9D8F" stroke-width="5" stroke-linecap="round"/>
<path d="M788 317l12 15 12-15" fill="none" stroke="#2A9D8F" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

<!-- ROUTING -->
<rect x="60" y="332" width="1480" height="190" rx="28" fill="#F5F8FC" stroke="#183B67" stroke-width="3"/>
<text x="90" y="370" class="section">INBOUND TRAFFIC &amp; ROUTING</text>

<rect x="92" y="392" width="690" height="98" rx="20" fill="#FFFFFF" stroke="#183B67" stroke-width="2.5"/>
<text x="437" y="428" text-anchor="middle" class="cardTitle">Route 53 + ALB + AWS Shield</text>
<text x="437" y="460" text-anchor="middle" class="cardText">Latency routing · DDoS protection</text>

<rect x="818" y="392" width="690" height="98" rx="20" fill="#FFFFFF" stroke="#183B67" stroke-width="2.5"/>
<text x="1163" y="428" text-anchor="middle" class="cardTitle">Envoy API Gateway</text>
<text x="1163" y="460" text-anchor="middle" class="cardText">Rate limiting · JWT auth · TLS termination</text>

<path d="M800 522v26" stroke="#2A9D8F" stroke-width="5" stroke-linecap="round"/>
<path d="M788 539l12 15 12-15" fill="none" stroke="#2A9D8F" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

<!-- BUS -->
<rect x="60" y="554" width="1480" height="155" rx="28" fill="#F5F8FC" stroke="#183B67" stroke-width="3"/>
<text x="90" y="592" class="section">ASYNCHRONOUS EVENT BUS</text>

<rect x="92" y="614" width="1416" height="68" rx="18" fill="#FFFFFF" stroke="#183B67" stroke-width="2.5"/>
<text x="800" y="643" text-anchor="middle" class="cardTitle">Redpanda / Apache Kafka</text>
<text x="800" y="670" text-anchor="middle" class="cardText">code.submission.v1 · partitioned by organization ID · tiered audit storage on S3</text>

<path d="M800 709v26" stroke="#2A9D8F" stroke-width="5" stroke-linecap="round"/>
<path d="M788 726l12 15 12-15" fill="none" stroke="#2A9D8F" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

<!-- COMPUTE -->
<rect x="60" y="741" width="1480" height="205" rx="28" fill="#F5F8FC" stroke="#183B67" stroke-width="3"/>
<text x="90" y="779" class="section">COMPUTE &amp; ANALYSIS PIPELINE (EKS)</text>

<rect x="92" y="802" width="435" height="112" rx="20" fill="#FFFFFF" stroke="#183B67" stroke-width="2.5"/>
<text x="310" y="842" text-anchor="middle" class="cardTitle">Orchestrator (Go)</text>
<text x="310" y="877" text-anchor="middle" class="cardText">Saga state engine</text>

<rect x="583" y="802" width="435" height="112" rx="20" fill="#FFFFFF" stroke="#183B67" stroke-width="2.5"/>
<text x="800" y="842" text-anchor="middle" class="cardTitle">Static Analyzer (Go/WASM)</text>
<text x="800" y="877" text-anchor="middle" class="cardText">AST · regex · data masking</text>

<rect x="1074" y="802" width="434" height="112" rx="20" fill="#FFFFFF" stroke="#183B67" stroke-width="2.5"/>
<text x="1291" y="842" text-anchor="middle" class="cardTitle">Context Resolver (Go)</text>
<text x="1291" y="877" text-anchor="middle" class="cardText">Repo metadata · vector queries</text>

<path d="M800 946v26" stroke="#2A9D8F" stroke-width="5" stroke-linecap="round"/>
<path d="M788 963l12 15 12-15" fill="none" stroke="#2A9D8F" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

<!-- SEMANTIC -->
<rect x="60" y="978" width="1480" height="120" rx="28" fill="url(#mint)" stroke="#2A9D8F" stroke-width="3"/>
<text x="90" y="1015" class="sectionMint">SEMANTIC AI ENGINE</text>

<rect x="92" y="1031" width="690" height="50" rx="16" fill="#FFFFFF" stroke="#2A9D8F" stroke-width="2.5"/>
<text x="437" y="1064" text-anchor="middle" class="cardTitle">Local Model Pool — vLLM · DeepSeek-Coder / CodeLlama</text>

<rect x="818" y="1031" width="690" height="50" rx="16" fill="#FFFFFF" stroke="#2A9D8F" stroke-width="2.5"/>
<text x="1163" y="1064" text-anchor="middle" class="cardTitle">Cloud Consensus Engine — Claude Sonnet 4.6 / Gemini</text>
</svg>