{{- /*
One Secret holds every sensitive value; only non-empty keys are rendered, and
with no credentials at all the Secret is omitted entirely — the deployments'
secretKeyRef entries are `optional`, so a missing credential disables that
feature at the service's own boundary instead of blocking the install.
*/ -}}
{{- $creds := dict -}}
{{- range $key, $value := .Values.credentials }}
{{- if $value }}
{{- $_ := set $creds $key $value }}
{{- end }}
{{- end }}
{{- if $creds }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "membrane.fullname" . }}-credentials
  labels:
    {{- include "membrane.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := $creds }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
