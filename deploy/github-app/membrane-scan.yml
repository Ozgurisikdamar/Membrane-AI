# Drop-in PR gate using the MEMBRANE.AI Code Sweeper CLI — the zero-backend
# path to SCM integration. Copy to a target repo's .github/workflows/.
# Blocks the PR when the offline scan finds a blocking issue; uploads the
# Technical-Debt Report as an artifact.
name: MEMBRANE.AI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  code-sweeper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Install membrane CLI
        run: go install github.com/Ozgurisikdamar/Membrane-AI/clients/cli/cmd/membrane@latest
      - name: Scan (blocks on blocking findings)
        run: membrane scan . --fail-on=blocking
      - name: Technical-debt report
        if: always()
        run: membrane scan . --report html --out membrane-report.html --fail-on=never
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: membrane-report
          path: membrane-report.html
