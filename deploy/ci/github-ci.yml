# GitHub Actions CI for MEMBRANE.AI.
#
# NOTE (D-026): this file is tracked here — NOT under .github/workflows/ —
# because the push token deliberately lacks the 'workflow' scope. To enable CI,
# copy this file once to .github/workflows/ci.yml via the GitHub web UI
# (Add file → paste → commit); afterwards keep this copy as the source of truth
# and mirror any edits the same way.

name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  GOWORK: "off" # use in-repo replace directives, not any external workspace

jobs:
  build-test:
    name: build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Install go-task
        run: go install github.com/go-task/task/v3/cmd/task@latest
      - name: Test
        run: task test
      - name: Build
        run: task build

  lint:
    name: lint (buf + golangci-lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install go-task & golangci-lint
        run: |
          go install github.com/go-task/task/v3/cmd/task@latest
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
      - name: buf lint
        working-directory: proto
        run: buf lint
      - name: buf breaking (against main)
        if: github.event_name == 'pull_request'
        working-directory: proto
        run: buf breaking --against 'https://github.com/${{ github.repository }}.git#branch=main,subdir=proto'
      - name: golangci-lint
        run: task lint

  race:
    name: race detector (linux)
    runs-on: ubuntu-latest
    env:
      GOWORK: "off"
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Test with race detector
        run: |
          for m in clients/cli pkg proto services/analyzer services/ingestion services/orchestrator services/reporter services/resolver; do
            (cd "$m" && go test -race ./...)
          done

  images:
    name: container images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Go service images
        run: |
          for s in analyzer ingestion orchestrator reporter resolver; do
            docker build -f deploy/docker/Dockerfile.go --build-arg SERVICE=services/$s -t membrane/$s:ci .
          done
      - name: Build semantic image
        run: docker build -f deploy/docker/Dockerfile.semantic -t membrane/semantic:ci .

  helm:
    name: helm chart (lint + render + schema)
    runs-on: ubuntu-latest # helm is preinstalled on the runner
    steps:
      - uses: actions/checkout@v4
      - name: helm lint
        run: helm lint deploy/helm/membrane
      - name: helm template + kubeconform
        run: |
          go install github.com/yannh/kubeconform/cmd/kubeconform@latest
          helm template smoke deploy/helm/membrane \
            --set credentials.databaseUrl=x --set provisioning.topics.enabled=true \
            | $(go env GOPATH)/bin/kubeconform -strict -summary

  release:
    name: CLI release (GoReleaser)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release + upload artifacts
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # GoReleaser needs full history + tags
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
          workdir: clients/cli
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOWORK: "off"

  publish-images:
    name: publish multi-arch images (ghcr)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push multi-arch service images
        run: |
          TAG="${GITHUB_REF_NAME}"
          for s in analyzer ingestion orchestrator reporter resolver; do
            docker buildx build --platform linux/amd64,linux/arm64 \
              -f deploy/docker/Dockerfile.go --build-arg SERVICE=services/$s \
              -t ghcr.io/${{ github.repository_owner }}/membrane-$s:"$TAG" --push .
          done
          docker buildx build --platform linux/amd64,linux/arm64 \
            -f deploy/docker/Dockerfile.semantic \
            -t ghcr.io/${{ github.repository_owner }}/membrane-semantic:"$TAG" --push .

  python:
    name: semantic service (ruff + mypy + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/semantic
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install --quiet -e ".[dev]"
      - name: ruff
        run: |
          ruff check .
          ruff format --check .
      - name: mypy (strict)
        run: mypy semantic
      - name: pytest
        run: pytest
